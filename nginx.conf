server {
  listen 80; server_name localhost;
  root /usr/share/nginx/html; index index.html;
  gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|avif|ico)$ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; access_log off; }
  location / { try_files $uri $uri/ $uri.html /index.html; }
  error_page 404 /404.html;
}
